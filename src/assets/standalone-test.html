  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ont-display: swap;\n  src: url(\"55540323-7304-428e-beeb-fa88031e4236\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Plus Jakarta Sans';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"51297bfb-21d1-499d-8a16-9e842f2ec42b\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Plus Jakarta Sans';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"5969516f-1b44-44ef-8fc0-89f95d7fdd6e\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Plus Jakarta Sans';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"f217ca95-4057-4914-bec4-a890342dfd93\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Plus Jakarta Sans';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"55540323-7304-428e-beeb-fa88031e4236\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root {\n    --purple: #7E397E;\n    --purple-light: #A855A8;\n    --purple-dim: #f3e8f3;\n    --grey-0: #f8f8f7;\n    --grey-1: #f0efed;\n    --grey-2: #e2e0dc;\n    --grey-3: #bdbab4;\n    --grey-4: #888480;\n    --grey-5: #3a3835;\n    --black: #1a1917;\n    --white: #fefefe;\n  }\n  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n  html { scroll-behavior: smooth; }\n  body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--white); color: var(--black); overflow-x: hidden; }\n\n  /* NAV */\n  nav {\n    position: fixed; top: 0; left: 0; right: 0; z-index: 100;\n    display: flex; align-items: center; justify-content: space-between;\n    padding: 0 48px; height: 64px;\n    background: rgba(254,254,254,0.92); backdrop-filter: blur(12px);\n    border-bottom: 1px solid var(--grey-2);\n  }\n  .nav-logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 20px; color: var(--black); text-decoration: none; }\n  .logo-sos { color: var(--purple); font-size: 24px; letter-spacing: -1px; }\n  .nav-links { display: flex; gap: 32px; list-style: none; }\n  .nav-links a { text-decoration: none; color: var(--grey-4); font-size: 14px; font-weight: 500; transition: color .2s; }\n  .nav-links a:hover { color: var(--black); }\n  .nav-cta { background: var(--purple); color: white; border: none; padding: 10px 22px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .2s; font-family: inherit; }\n  .nav-cta:hover { background: var(--purple-light); }\n\n  /* HERO */\n  .hero {\n    margin-top: 64px;\n    min-height: 92vh;\n    display: grid; grid-template-columns: 1fr 1fr;\n    background: var(--grey-0);\n    position: relative; overflow: hidden;\n  }\n  .hero-shapes {\n    position: absolute; inset: 0; pointer-events: none; z-index: 0;\n  }\n  .shape { position: absolute; background: var(--grey-2); }\n  .shape-1 { width: 180px; height: 180px; top: -40px; right: 42%; transform: rotate(18deg); opacity: .6; }\n  .shape-2 { width: 90px; height: 90px; top: 30%; right: 44%; transform: rotate(34deg); background: var(--purple-dim); }\n  .shape-3 { width: 260px; height: 60px; bottom: 100px; left: -60px; transform: rotate(-8deg); opacity: .5; }\n  .shape-4 { width: 50px; height: 50px; bottom: 180px; left: 180px; transform: rotate(22deg); background: var(--purple); opacity: .3; }\n  .shape-5 { width: 120px; height: 120px; top: 120px; left: 60px; transform: rotate(5deg); opacity: .35; }\n\n  .hero-content {\n    position: relative; z-index: 1;\n    display: flex; flex-direction: column; justify-content: center;\n    padding: 80px 64px;\n    gap: 28px;\n  }\n  .hero-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--purple); }\n  .hero-title { font-size: clamp(36px, 4vw, 56px); font-weight: 800; line-height: 1.1; color: var(--black); }\n  .hero-title span { color: var(--purple); }\n  .hero-sub { font-size: 17px; color: var(--grey-4); line-height: 1.6; max-width: 420px; }\n  .hero-actions { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }\n  .btn-primary { background: var(--purple); color: white; border: none; padding: 14px 28px; border-radius: 6px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; transition: background .2s, transform .15s; }\n  .btn-primary:hover { background: var(--purple-light); transform: translateY(-1px); }\n  .btn-secondary { background: transparent; color: var(--black); border: 2px solid var(--grey-3); padding: 13px 28px; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; transition: border-color .2s; }\n  .btn-secondary:hover { border-color: var(--purple); color: var(--purple); }\n  .hero-stats { display: flex; gap: 32px; margin-top: 16px; }\n  .stat { display: flex; flex-direction: column; gap: 2px; }\n  .stat-num { font-size: 28px; font-weight: 800; color: var(--black); }\n  .stat-label { font-size: 12px; color: var(--grey-4); font-weight: 500; }\n\n  .hero-image-side {\n    position: relative; z-index: 1;\n    padding: 48px 64px 48px 0;\n    display: flex; flex-direction: column; gap: 16px; justify-content: center;\n  }\n  .hero-img-main {\n    width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 12px;\n    display: block;\n  }\n  .hero-img-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }\n  .hero-img-small { width: 100%; aspect-ratio: 16/10; object-fit: cover; border-radius: 8px; display: block; }\n  .img-tag {\n    position: absolute; bottom: 16px; left: 16px;\n    background: var(--white); padding: 8px 14px; border-radius: 6px;\n    font-size: 13px; font-weight: 700; color: var(--purple);\n    box-shadow: 0 2px 12px rgba(0,0,0,.1);\n  }\n\n  /* CARDS SCROLL SECTION (Nubank style) */\n  .scroll-cards {\n    padding: 80px 0;\n    background: var(--white);\n  }\n  .scroll-cards h2 { text-align: center; font-size: 14px; font-weight: 700; color: var(--purple); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 40px; }\n  .cards-track {\n    display: flex; gap: 24px; overflow-x: auto; padding: 0 48px 24px;\n    scrollbar-width: none;\n  }\n  .cards-track::-webkit-scrollbar { display: none; }\n  .service-card {\n    flex: 0 0 280px; background: var(--grey-0); border-radius: 16px;\n    padding: 32px 28px 28px; position: relative; overflow: hidden;\n    display: flex; flex-direction: column; gap: 16px;\n    transition: transform .2s, box-shadow .2s;\n    cursor: pointer;\n  }\n  .service-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,.08); }\n  .service-card-shape {\n    position: absolute; width: 80px; height: 80px; top: -20px; right: -20px;\n    background: var(--grey-2); transform: rotate(20deg); border-radius: 4px;\n    transition: background .2s;\n  }\n  .service-card:hover .service-card-shape { background: var(--purple-dim); }\n  .service-card h3 { font-size: 20px; font-weight: 700; line-height: 1.2; position: relative; }\n  .service-card p { font-size: 14px; color: var(--grey-4); line-height: 1.6; position: relative; }\n  .card-arrow {\n    width: 36px; height: 36
